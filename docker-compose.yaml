services:
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_pass
      POSTGRES_DB: wallet_db

  wallet-service:
    build: .
    container_name: wallet-service
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/wallet_db
      JDBC_USERNAME: wallet_user
      JDBC_PASSWORD: wallet_pass
      WALLET_SERVER_PORT: 8080
